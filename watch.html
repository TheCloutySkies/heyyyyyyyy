<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch - Clouty Skies</title>
  <link rel="stylesheet" href="vendor/xp.css" />
  <link rel="stylesheet" href="luna.css" />
  <style>
    body {
      background: #245EDC url('wallpaper.jpg') center/cover fixed;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, "Segoe UI", Arial, sans-serif;
      padding: 20px;
    }
    .window {
      min-width: 400px;
      max-width: 90vw;
      margin: auto;
      resize: both;
      overflow: hidden;
    }
    .window-body {
      padding: 24px;
      background: #fff;
      overflow-y: auto;
      max-height: calc(90vh - 100px);
    }
    .channel-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 18px;
    }
    .channel-buttons button {
      min-width: 160px;
    }
    .channel-embed {
      margin-bottom: 32px;
      box-shadow: inset 1px 1px #dfdfdf, inset -1px -1px #808080;
      padding: 10px;
      background: #f0f0f0;
    }
    .channel-label {
      margin-top: 12px;
      padding: 6px;
      background: #e8e8e8;
      border: 1px solid #919b9c;
      font-weight: bold;
      color: #222;
    }
    @media (max-width: 900px) {
      body { padding: 10px; }
      .window { 
        min-width: calc(100% - 20px);
        max-width: calc(100% - 20px);
        resize: vertical;
      }
      .window-body { padding: 12px; }
      .channel-buttons {
        flex-direction: column;
        gap: 10px;
      }
    }
    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      min-width: 120px;
    }
    .back-button.window {
      resize: none;
      min-width: auto;
      margin: 0;
      background: linear-gradient(180deg, #fff 0%, #ddd 100%);
    }
    .back-button .window-body {
      margin: 0;
      padding: 6px 12px;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-button:hover .window-body {
      background: rgba(0,0,0,0.1);
    }
    .back-button img {
      width: 16px;
      height: 16px;
    }
    .yt-facade {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      aspect-ratio: 16/9;
      border: 1px solid #919b9c;
      background: #1f1f1f;
      color: #fff;
      text-align: center;
      padding: 12px;
      box-sizing: border-box;
    }
    .yt-facade .yt-note {
      margin: 0;
      font-size: 11px;
      color: #cfcfcf;
      max-width: 34ch;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-button window">
    <div class="title-bar">
      <div class="title-bar-text">Navigation</div>
      <div class="title-bar-controls">
        <button aria-label="Close"></button>
      </div>
    </div>
    <div class="window-body">
      <img src="icons/system_restore-4.png" alt="" />
      Back to Home
    </div>
  </a>
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">YouTube Channels - Clouty Skies</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>
    <div class="window-body">
      <div class="channel-buttons">
        <button onclick="window.open('https://www.youtube.com/@CloutySkies', '_blank')">
          <img src="icons/camera3_vid-2.png" style="width:16px;height:16px;vertical-align:bottom;margin-right:4px;" />
          Main Channel
        </button>
        <button onclick="window.open('https://www.youtube.com/@CloutySkies2', '_blank')">
          <img src="icons/camera3_network-2.png" style="width:16px;height:16px;vertical-align:bottom;margin-right:4px;" />
          Second Channel
        </button>
      </div>
      <div class="channel-embed">
        <div class="yt-facade" data-yt-src="https://www.youtube.com/embed/videoseries?list=UUlGZ1mVWqeLSfKySDC-DS0Q" data-yt-title="Main Channel">
          <button type="button" class="button" data-yt-load>Load the channel</button>
          <span class="yt-note">YouTube loads only when you click — nothing third-party before that.</span>
        </div>
        <div class="channel-label">
          <img src="icons/video_-1.png" style="width:16px;height:16px;vertical-align:bottom;margin-right:4px;" />
          Main Channel - More "Cinematic" Content
        </div>
      </div>
      <div class="channel-embed">
        <div class="yt-facade" data-yt-src="https://www.youtube.com/embed/videoseries?list=UUQZChf2yw5yPupP8W2y_Yyg" data-yt-title="Second Channel">
          <button type="button" class="button" data-yt-load>Load the channel</button>
          <span class="yt-note">YouTube loads only when you click — nothing third-party before that.</span>
        </div>
        <div class="channel-label">
          <img src="icons/video_-2.png" style="width:16px;height:16px;vertical-align:bottom;margin-right:4px;" />
          Second Channel - The Goofier Side
        </div>
      </div>
    </div>
    <div class="status-bar">
      <p class="status-bar-field">2 Items</p>
      <p class="status-bar-field">© Clouty Skies</p>
    </div>
  </div>
  <script>
    (function () {
      document.querySelectorAll(".yt-facade[data-yt-src]").forEach(function (facade) {
        var button = facade.querySelector("[data-yt-load]");
        if (!button) return;
        button.addEventListener("click", function () {
          var frame = document.createElement("iframe");
          frame.src = facade.getAttribute("data-yt-src");
          frame.title = facade.getAttribute("data-yt-title") || "YouTube";
          frame.setAttribute("allowfullscreen", "");
          frame.setAttribute(
            "allow",
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          );
          frame.style.cssText = "width:100%;aspect-ratio:16/9;border:1px solid #919b9c;";
          facade.innerHTML = "";
          facade.style.padding = "0";
          facade.style.background = "transparent";
          facade.style.border = "0";
          facade.appendChild(frame);
        });
      });
    })();
  </script>
</body>
</html>
