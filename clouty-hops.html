<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Clouty Hops</title>
  <script>
    /* Inside a shell window the game drops its own window frame */
    if (/[?&]embed=1/.test(location.search)) {
      document.documentElement.setAttribute("data-embedded", "");
    }
  </script>
  <link rel="stylesheet" href="vendor/xp.css?v=2" />
  <link rel="stylesheet" href="luna.css?v=4" />
  <style>
    * { box-sizing: border-box; }

    .hops-app { width: min(96vw, 700px); max-width: none; }

    .game-container { padding: 10px; background: var(--luna-face); }

    #gameCanvas {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      background: #8ec5f0;
      border-radius: 1px;
    }

    #score-display {
      margin: 8px 0 0;
      padding: 3px 6px;
      font: 700 11px var(--luna-font-ui);
      color: #003399;
      background: #fff;
      border: 1px solid var(--luna-border);
      border-radius: 2px;
    }

    .hops-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 0 10px 10px;
      background: var(--luna-face);
    }

    .jump-button {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 54px;
      z-index: 1000;
      font: 700 18px var(--luna-font-title);
    }

    .jump-button:active { transform: translateX(-50%); }

    .settings-toggle {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      min-width: 84px;
      z-index: 1000;
    }

    .settings-panel {
      position: fixed;
      top: max(56px, calc(env(safe-area-inset-top) + 44px));
      right: max(12px, env(safe-area-inset-right));
      width: min(300px, calc(100vw - 24px));
      z-index: 1100;
      display: none;
    }

    .settings-panel.visible { display: block; }

    .settings-panel .window-body { background: var(--luna-face); }

    .settings-group { margin: 0 0 10px; }

    .settings-group label { display: block; margin-bottom: 4px; }

    .value-display { font-weight: 700; color: #003399; }

    .settings-panel input[type="range"] { width: 100%; }

    @media (max-width: 700px) {
      .game-container { padding: 6px; }
      #gameCanvas { width: 100%; height: auto; aspect-ratio: 650 / 500; }
      .jump-button { width: min(200px, calc(100vw - 24px)); height: 50px; font-size: 16px; }
    }
  </style>
</head>
<body class="luna-page">

<main class="window luna-app hops-app" role="application" aria-label="Clouty Hops window">
  <div class="title-bar">
    <div class="title-bar-text">
      <img src="icons/game_mine_1-0.png" alt="" width="16" height="16" style="vertical-align: text-bottom; margin-right: 6px; image-rendering: pixelated;" />
      Clouty Hops
    </div>
    <div class="title-bar-controls">
      <button type="button" aria-label="Close" title="Close and return to desktop" onclick="location.href='index.html'"></button>
    </div>
  </div>
  <div class="game-container">
    <canvas id="gameCanvas" width="650" height="500"></canvas>
    <div id="score-display">Score: 0</div>
  </div>
  <div class="hops-actions">
    <button type="button" class="button" id="resetButton" onclick="location.reload()">Play Again</button>
  </div>
  <div class="status-bar">
    <p class="status-bar-field">Clouty Games</p>
    <p class="status-bar-field">Hops</p>
  </div>
</main>

<button type="button" class="button settings-toggle" onclick="toggleSettings()">Settings</button>

<div class="window settings-panel" id="settingsPanel" role="dialog" aria-labelledby="hops-settings-title">
  <div class="title-bar">
    <div class="title-bar-text" id="hops-settings-title">Game Settings</div>
    <div class="title-bar-controls">
      <button type="button" aria-label="Close" onclick="toggleSettings()"></button>
    </div>
  </div>
  <div class="window-body">
    <fieldset class="settings-group">
      <legend>Gravity</legend>
      <label for="gravity">Gravity: <span class="value-display" id="gravityValue">0.25</span></label>
      <input type="range" id="gravity" min="0.1" max="0.5" step="0.05" value="0.25">
    </fieldset>
    <fieldset class="settings-group">
      <legend>Jump</legend>
      <label for="jumpForce">Jump Force: <span class="value-display" id="jumpForceValue">-6</span></label>
      <input type="range" id="jumpForce" min="4" max="8" step="0.5" value="6">
    </fieldset>
    <fieldset class="settings-group">
      <legend>Speed</legend>
      <label for="gameSpeed">Game Speed: <span class="value-display" id="gameSpeedValue">2</span></label>
      <input type="range" id="gameSpeed" min="1" max="5" step="0.5" value="2">
    </fieldset>
    <fieldset class="settings-group">
      <legend>Pipes</legend>
      <label for="pipeGap">Pipe Gap: <span class="value-display" id="pipeGapValue">150</span></label>
      <input type="range" id="pipeGap" min="100" max="200" step="10" value="150">
    </fieldset>
  </div>
</div>

<button type="button" class="luna-key jump-button" id="jumpButton">Jump</button>

<script>
    // Game constants
    let GRAVITY = 0.15;
    let JUMP_FORCE = -4;
    let PIPE_SPEED = 1.5;
    let PIPE_SPAWN_RATE = 180;
    let PIPE_GAP = 200;
    let PIPE_WIDTH = 60;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const jumpButton = document.getElementById('jumpButton');
    const scoreDisplay = document.getElementById('score-display');

    const GAME_BASE_W = 650;
    const GAME_BASE_H = 500;

    const bubbles = Array(20).fill().map(() => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 30 + 10
    }));

    function layoutCanvasToContainer() {
      var wrap = canvas.parentElement;
      var avail = wrap ? wrap.clientWidth : GAME_BASE_W;
      var w = Math.max(200, Math.min(GAME_BASE_W, Math.floor(avail)));
      var h = Math.round((w * GAME_BASE_H) / GAME_BASE_W);
      h = Math.max(200, Math.min(GAME_BASE_H, h));
      w = Math.round((h * GAME_BASE_W) / GAME_BASE_H);
      if (canvas.width === w && canvas.height === h) return;
      canvas.width = w;
      canvas.height = h;
      bird.x = Math.min(Math.max(48, bird.x), canvas.width - bird.width - 8);
      bird.y = Math.min(Math.max(bird.height / 2, bird.y), canvas.height - bird.height / 2);
      pipes.forEach(function (p) {
        if (p.x > canvas.width + 120) p.x = canvas.width + 40;
      });
      bubbles.forEach(function (b) {
        b.x = Math.min(b.x, canvas.width - 1);
        b.y = Math.min(b.y, canvas.height - 1);
      });
    }

    // Game state
    let isPlaying = false;
    let score = 0;
    let highScore = localStorage.getItem('highScore') || 0;

    // Bird sprite: loaded once and reused every frame
    const birdSprite = new Image();
    birdSprite.src = 'horrid.png';

    // Bird object
    const bird = {
      x: 120, // Adjust for new canvas size
      y: canvas.height / 2,
      width: 40, // Size for the image
      height: 40,
      velocity: 0,
      gravity: GRAVITY,
      rotation: 0,
      collisionRadius: 16, // Smaller collision radius for more precise hits

      draw() {
        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + this.height/2);
        this.rotation = Math.min(Math.max(this.velocity * 0.1, -0.5), 0.5);
        ctx.rotate(this.rotation);
        
        // Draw bird image
        if (birdSprite.complete) {
          ctx.drawImage(birdSprite, -this.width/2, -this.height/2, this.width, this.height);
        }
        
        // Debug collision circle (comment out in production)
        // ctx.beginPath();
        // ctx.arc(0, 0, this.collisionRadius, 0, Math.PI * 2);
        // ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
        // ctx.stroke();
        
        // Gloss effect
        const glossGradient = ctx.createRadialGradient(
          -this.width/4, -this.height/4, 0,
          -this.width/4, -this.height/4, this.width/2
        );
        glossGradient.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
        glossGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = glossGradient;
        ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
        
        ctx.restore();
      },

      update() {
        this.velocity += this.gravity;
        this.y += this.velocity;
      },

      jump() {
        this.velocity = JUMP_FORCE;
      },

      reset() {
        this.y = canvas.height / 2;
        this.velocity = 0;
      }
    };

    // Pipe array
    let pipes = [];
    let frames = 0;

    // Game functions
    function createPipe() {
      var minHeight = Math.min(80, Math.max(32, Math.floor(canvas.height * 0.15)));
      var bottomReserve = 40;
      var maxGap = canvas.height - minHeight - bottomReserve;
      if (maxGap < 50) return;
      var gap = Math.min(PIPE_GAP, maxGap);
      gap = Math.max(44, gap);
      var maxTopHeight = canvas.height - gap - minHeight;
      if (maxTopHeight <= minHeight) return;
      var height = Math.random() * (maxTopHeight - minHeight) + minHeight;
      pipes.push({
        x: canvas.width,
        topHeight: height,
        gap: gap,
        scored: false,
        passed: false
      });
    }

    function drawPipes() {
      pipes.forEach(pipe => {
        // Create gradients
        const topGradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + PIPE_WIDTH, 0);
        topGradient.addColorStop(0, '#98ff98');
        topGradient.addColorStop(1, '#50c878');
        const bottomGradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + PIPE_WIDTH, 0);
        bottomGradient.addColorStop(0, '#ffb7c5');
        bottomGradient.addColorStop(1, '#ff69b4');
        
        // Draw pipes with glass effect
        function drawGlassPipe(x, y, width, height, gradient) {
          // Main pipe
          ctx.fillStyle = gradient;
          ctx.fillRect(x, y, width, height);
          
          // Glass shine
          const shine = ctx.createLinearGradient(x, y, x + width, y);
          shine.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
          shine.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');
          shine.addColorStop(1, 'rgba(255, 255, 255, 0.4)');
          ctx.fillStyle = shine;
          ctx.fillRect(x + 2, y, 3, height);
        }

        // Draw pipes
        drawGlassPipe(pipe.x, 0, PIPE_WIDTH, pipe.topHeight, topGradient);
        var pg = pipe.gap != null ? pipe.gap : PIPE_GAP;
        drawGlassPipe(pipe.x, pipe.topHeight + pg, PIPE_WIDTH, canvas.height - (pipe.topHeight + pg), bottomGradient);
      });
    }

    // Update game background
    function drawBackground() {
      // Vista-style gradient background
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#b7d9f7');
      gradient.addColorStop(1, '#ddf3ff');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Add some floating bubbles
      for(let i = 0; i < bubbles.length; i++) {
        const bubble = bubbles[i];
        ctx.beginPath();
        ctx.arc(bubble.x, bubble.y, bubble.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fill();
        
        // Move bubbles
        bubble.y -= 0.2;
        bubble.x += Math.sin(frames / 50 + i) * 0.5;
        
        if(bubble.y < -bubble.size) {
          bubble.y = canvas.height + bubble.size;
          bubble.x = Math.random() * canvas.width;
        }
      }
    }

    function checkCollision(pipe) {
      // Calculate distance from bird center to pipe edges
      const birdCenterX = bird.x + bird.width/2;
      const birdCenterY = bird.y + bird.height/2;
      
      // Check top pipe
      if (birdCenterY - bird.collisionRadius < pipe.topHeight) {
        if (Math.abs(birdCenterX - (pipe.x + PIPE_WIDTH/2)) < (PIPE_WIDTH/2 + bird.collisionRadius)) {
          return true;
        }
      }
      
      var pipeGap = pipe.gap != null ? pipe.gap : PIPE_GAP;
      // Check bottom pipe
      if (birdCenterY + bird.collisionRadius > pipe.topHeight + pipeGap) {
        if (Math.abs(birdCenterX - (pipe.x + PIPE_WIDTH/2)) < (PIPE_WIDTH/2 + bird.collisionRadius)) {
          return true;
        }
      }
      
      return false;
    }

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const deltaTime = (timestamp - lastTime) / 16; // Target 60 FPS
      lastTime = timestamp;

      layoutCanvasToContainer();

      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw background
      drawBackground();

      if (!isPlaying) {
        ctx.fillStyle = '#335c81';
        ctx.font = '20px "Segoe UI"';
        ctx.textAlign = 'center';
        ctx.fillText('Press SPACE or tap JUMP! to start', canvas.width/2, canvas.height/2);
        ctx.fillText(`High Score: ${highScore}`, canvas.width/2, canvas.height/2 + 30);
        bird.draw();
        requestAnimationFrame(gameLoop);
        return;
      }

      // Update bird
      bird.update();
      bird.draw();

      // Create new pipes
      if (frames % PIPE_SPAWN_RATE === 0) {
        createPipe();
      }

      // Update and draw pipes
      pipes.forEach(pipe => {
        pipe.x -= PIPE_SPEED * deltaTime;
        // More precise score detection
        if (!pipe.scored && pipe.x + PIPE_WIDTH < bird.x) {
          score++;
          pipe.scored = true;
          scoreDisplay.textContent = `Score: ${score}`;
        }
      });

      drawPipes();

      // Remove off-screen pipes
      pipes = pipes.filter(pipe => pipe.x > -50);

      // Check collisions
      if (
        bird.y > canvas.height - bird.height / 2 ||
        bird.y < bird.height / 2 ||
        pipes.some(checkCollision)
      ) {
        gameOver();
        return;
      }

      frames++;
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      isPlaying = true;
      score = 0;
      pipes = [];
      frames = 0;
      bird.reset();
      scoreDisplay.textContent = 'Score: 0';
    }

    function gameOver() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('highScore', highScore);
      }
      isPlaying = false;
      document.getElementById('resetButton').style.display = 'block';
      alert(`Game Over!\nScore: ${score}\nHigh Score: ${highScore}`);
    }

    // Add settings functionality
    function toggleSettings() {
      document.getElementById('settingsPanel').classList.toggle('visible');
    }

    function updateSetting(setting, value) {
      const valueDisplay = document.getElementById(`${setting}Value`);
      valueDisplay.textContent = value;
      
      switch(setting) {
        case 'gravity':
          GRAVITY = value;
          bird.gravity = value;
          break;
        case 'jumpForce':
          JUMP_FORCE = -value;
          break;
        case 'gameSpeed':
          PIPE_SPEED = value;
          break;
        case 'pipeGap':
          PIPE_GAP = value;
          break;
      }
    }

    // Add event listeners for settings
    document.querySelectorAll('.settings-panel input').forEach(input => {
      input.addEventListener('input', (e) => {
        updateSetting(e.target.id, e.target.value);
      });
    });

    // Initialize default settings
    document.addEventListener('DOMContentLoaded', () => {
      layoutCanvasToContainer();
      var gc = document.querySelector('.game-container');
      if (gc && typeof ResizeObserver !== 'undefined') {
        var ro = new ResizeObserver(function () {
          layoutCanvasToContainer();
        });
        ro.observe(gc);
      }
      window.addEventListener(
        'resize',
        function () {
          layoutCanvasToContainer();
        },
        { passive: true }
      );

      // Set initial values
      document.getElementById('gravity').value = GRAVITY;
      document.getElementById('jumpForce').value = Math.abs(JUMP_FORCE);
      document.getElementById('gameSpeed').value = PIPE_SPEED;
      document.getElementById('pipeGap').value = PIPE_GAP;
      
      // Update displays
      document.getElementById('gravityValue').textContent = GRAVITY;
      document.getElementById('jumpForceValue').textContent = Math.abs(JUMP_FORCE);
      document.getElementById('gameSpeedValue').textContent = PIPE_SPEED;
      document.getElementById('pipeGapValue').textContent = PIPE_GAP;
    });

    // Event listeners
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        if (!isPlaying) startGame();
        bird.jump();
      }
    });

    jumpButton.addEventListener('click', () => {
      if (!isPlaying) startGame();
      bird.jump();
    });

    // Start game loop with timestamp
    let lastTime = 0;
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
