<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Clouty Hops</title>
  <style>
    :root {
      --xp-face: linear-gradient(180deg, #cddcec 0%, #b1c6e8 100%);
      --xp-title: linear-gradient(180deg, #2657c5 0%, #1d4ba3 100%);
      --xp-blue: #245edc;
      --xp-gray: #ece9d8;
      --win-light: #ffffff;
      --win-dark: #808080;
      --win-darker: #404040;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #316a45 url("https://upload.wikimedia.org/wikipedia/en/7/7d/Bliss.png") center /
        cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Tahoma, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      body {
        background-attachment: scroll;
      }
    }

    .window {
      background: var(--xp-gray);
      border: 1px solid #003399;
      border-radius: 8px 8px 0 0;
      box-shadow: 4px 4px 16px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      position: relative;
      width: 700px;
      margin: 0 auto;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .title-bar {
      padding: 4px 6px;
      background: var(--xp-title);
      display: flex;
      justify-content: flex-start;
      align-items: center;
      border-bottom: 1px solid #003399;
      gap: 8px;
    }

    .title-bar-icon {
      width: 16px;
      height: 16px;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .title-bar h1 {
      margin: 0;
      flex: 1;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.35);
    }

    .game-container {
      position: relative;
      padding: 12px;
      background: var(--xp-face);
      border-top: 1px solid #fff;
    }

    #gameCanvas {
      width: 650px;
      height: 500px;
      display: block;
      margin: 0 auto;
      border: 2px solid;
      border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);
      border-radius: 0;
      box-shadow: inset 1px 1px 0 rgba(0, 0, 0, 0.15);
      background: #87ceeb;
    }

    canvas {
      border-radius: 0;
      margin: 0;
      image-rendering: auto;
    }

    /* Flappy-style score (canvas HUD); DOM backup hidden */
    #score-display {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
      font-family: Tahoma, Arial, sans-serif;
      font-weight: bold;
      font-size: clamp(36px, 11vw, 52px);
      color: #fff;
      text-shadow:
        2px 2px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    #score-display .best {
      display: block;
      text-align: center;
      font-size: 11px;
      font-weight: normal;
      margin-top: 2px;
      color: #ece9d8;
      text-shadow: 1px 1px 0 #000;
      letter-spacing: 0;
    }

    .controls-hint {
      color: #333;
      text-align: center;
      margin-top: 8px;
      font-size: 11px;
    }

    .xp-btn {
      padding: 4px 16px;
      font: 11px Tahoma, Arial, sans-serif;
      border-radius: 3px;
      border: 2px outset #ece9d8;
      background: linear-gradient(180deg, #f6f4ec 0%, #d8dfd4 45%, #cbd4c4 50%, #cdd8c8 100%);
      color: #000;
      cursor: pointer;
      box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.2);
    }

    .xp-btn:active {
      border-style: inset;
      padding: 5px 15px 3px 17px;
    }

    .jump-button {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: min(220px, calc(100vw - 32px));
      height: 52px;
      z-index: 1000;
      font: bold 14px Tahoma, Arial, sans-serif;
      border: 2px outset #ece9d8;
      border-radius: 4px;
      background: linear-gradient(180deg, #f6f4ec 0%, #d8dfd4 45%, #cbd4c4 50%, #cdd8c8 100%);
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.25);
    }

    .jump-button:active {
      border-style: inset;
    }

    .back-home-button {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      z-index: 1100;
      font: 11px Tahoma, Arial, sans-serif;
      padding: 4px 12px;
      border: 2px outset #ece9d8;
      border-radius: 3px;
      background: linear-gradient(180deg, #f6f4ec 0%, #d8dfd4 45%, #cbd4c4 50%, #cdd8c8 100%);
      color: #000;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
    }

    .back-home-button:active {
      border-style: inset;
    }

    .settings-panel {
      position: fixed;
      top: 52px;
      right: max(12px, env(safe-area-inset-right));
      background: var(--xp-gray);
      border: 1px solid #003399;
      border-radius: 4px;
      box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.35);
      padding: 12px;
      color: #000;
      width: 280px;
      max-width: calc(100vw - 24px);
      z-index: 1000;
      display: none;
      font-size: 11px;
    }

    .settings-panel.visible {
      display: block;
    }

    .settings-group {
      background: #f1efe3;
      border: 1px solid #7f9db9;
      padding: 10px;
      margin-bottom: 10px;
    }

    .settings-group label {
      color: #000;
      font-size: 11px;
    }

    .settings-group input[type="range"] {
      width: 100%;
      margin: 6px 0;
    }

    .settings-toggle {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      width: 28px;
      height: 22px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 2px outset #ece9d8;
      border-radius: 3px;
      background: linear-gradient(180deg, #f6f4ec 0%, #d8dfd4 45%, #cbd4c4 50%, #cdd8c8 100%);
      cursor: pointer;
      z-index: 1100;
    }

    .settings-toggle:active {
      border-style: inset;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      background: #fff;
      border: 1px inset #7f9db9;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      background: linear-gradient(180deg, #fff 0%, #e6e6e6 100%);
      border: 1px solid #7f9db9;
      border-radius: 2px;
      cursor: pointer;
    }

    .reset-button {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 28px;
      font: bold 12px Tahoma, Arial, sans-serif;
      display: none;
      z-index: 1200;
      border: 2px outset #ece9d8;
      border-radius: 4px;
      background: linear-gradient(180deg, #f6f4ec 0%, #d8dfd4 45%, #cbd4c4 50%, #cdd8c8 100%);
      color: #000;
      cursor: pointer;
      box-shadow: 4px 4px 16px rgba(0, 0, 0, 0.45);
    }

    .reset-button:active {
      border-style: inset;
    }

    #game-overlay {
      position: fixed;
      inset: 0;
      z-index: 1150;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    #game-overlay.is-visible {
      display: flex;
    }

    .overlay-card {
      pointer-events: auto;
      background: var(--xp-gray);
      border: 1px solid #003399;
      border-radius: 4px;
      padding: 16px 24px;
      text-align: center;
      box-shadow: 4px 4px 20px rgba(0, 0, 0, 0.45);
      min-width: 220px;
    }

    .overlay-card h2 {
      font-size: 13px;
      margin-bottom: 8px;
      color: #000;
    }

    .overlay-card p {
      font-size: 11px;
      margin: 4px 0;
      color: #333;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Narrow viewports / iframe embed */
    @media (max-width: 760px) {
      body {
        align-items: flex-start;
        padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
          max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      }

      .back-home-button {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        font-size: 14px;
        padding: 8px 14px;
      }

      .window {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        width: 100%;
        max-width: 100%;
        margin: 0;
      }

      .game-container {
        padding: 10px;
      }

      #gameCanvas {
        width: 100% !important;
        max-width: 100%;
        height: auto !important;
        aspect-ratio: 650 / 500;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 12px;
      }

      .jump-button {
        bottom: max(12px, env(safe-area-inset-bottom));
        width: min(200px, calc(100vw - 24px));
        height: 52px;
        font-size: 20px;
      }

      .settings-panel {
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
        top: max(60px, env(safe-area-inset-top));
        width: auto;
        max-height: min(70vh, calc(100dvh - 80px));
        overflow-y: auto;
      }

      .settings-toggle {
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-home-button">Back</a>

  <div class="window">
    <div class="title-bar">
      <img src="https://win98icons.alexmeub.com/icons/png/game_mine_1-0.png" alt="" class="title-bar-icon" width="16" height="16" />
      <h1>Clouty Hops</h1>
    </div>
    <div class="game-container">
      <canvas id="gameCanvas" width="650" height="500"></canvas>
      <div id="score-display" class="visually-hidden" aria-live="polite">Score: 0</div>
      <p class="controls-hint">Space or tap — flap between the pipes</p>
    </div>
  </div>

  <button type="button" class="settings-toggle" id="btn-settings" aria-label="Settings">⚙</button>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-group">
      <h3 style="margin-bottom: 10px; font-size: 12px;">Settings</h3>
      <div class="settings-group">
        <label for="gravity">Gravity: <span id="gravityValue">0.35</span></label>
        <input type="range" id="gravity" min="0.2" max="0.55" step="0.01" value="0.35" />
      </div>
      <div class="settings-group">
        <label for="jumpForce">Flap strength: <span id="jumpForceValue">6.5</span></label>
        <input type="range" id="jumpForce" min="4.5" max="9" step="0.1" value="6.5" />
      </div>
      <div class="settings-group">
        <label for="gameSpeed">Pipe speed: <span id="gameSpeedValue">3</span></label>
        <input type="range" id="gameSpeed" min="2" max="6" step="0.1" value="3" />
      </div>
      <div class="settings-group">
        <label for="pipeGap">Pipe gap: <span id="pipeGapValue">130</span></label>
        <input type="range" id="pipeGap" min="110" max="180" step="5" value="130" />
      </div>
    </div>
  </div>

  <div id="game-overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title" aria-hidden="true">
    <div class="overlay-card">
      <h2 id="overlay-title">Game Over</h2>
      <p id="overlay-score-line"></p>
      <p id="overlay-best-line"></p>
      <button type="button" class="xp-btn" id="btn-play-again">Play Again</button>
    </div>
  </div>

  <button type="button" class="jump-button" id="jumpButton">Flap!</button>

  <script>
    let GRAVITY = 0.35;
    let JUMP_FORCE = -6.5;
    let PIPE_SPEED = 3;
    let PIPE_GAP = 130;
    let PIPE_WIDTH = 52;

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const jumpButton = document.getElementById("jumpButton");
    const scoreDisplay = document.getElementById("score-display");
    const gameOverlay = document.getElementById("game-overlay");
    const overlayScoreLine = document.getElementById("overlay-score-line");
    const overlayBestLine = document.getElementById("overlay-best-line");
    const btnPlayAgain = document.getElementById("btn-play-again");
    const btnSettings = document.getElementById("btn-settings");

    const GAME_BASE_W = 650;
    const GAME_BASE_H = 500;

    const clouds = Array(6)
      .fill(null)
      .map(function (_, i) {
        return {
          x: Math.random() * GAME_BASE_W,
          y: 40 + Math.random() * (GAME_BASE_H * 0.35),
          w: 60 + Math.random() * 80,
          h: 22 + Math.random() * 18,
          speed: 0.15 + Math.random() * 0.12
        };
      });

    let bgScroll = 0;
    let birdImg = new Image();
    birdImg.src = "horrid.png";
    let birdImgReady = false;
    birdImg.onload = function () {
      birdImgReady = true;
    };

    function layoutCanvasToContainer() {
      var wrap = canvas.parentElement;
      var avail = wrap ? wrap.clientWidth : GAME_BASE_W;
      var w = Math.max(200, Math.min(GAME_BASE_W, Math.floor(avail)));
      var h = Math.round((w * GAME_BASE_H) / GAME_BASE_W);
      h = Math.max(200, Math.min(GAME_BASE_H, h));
      w = Math.round((h * GAME_BASE_W) / GAME_BASE_H);
      if (canvas.width === w && canvas.height === h) return;
      canvas.width = w;
      canvas.height = h;
      bird.x = Math.min(Math.max(48, bird.x), canvas.width - bird.width - 8);
      bird.y = Math.min(Math.max(bird.height / 2, bird.y), canvas.height - bird.height / 2);
      pipes.forEach(function (p) {
        if (p.x > canvas.width + 120) p.x = canvas.width + 40;
      });
      clouds.forEach(function (c) {
        c.x = Math.min(c.x, canvas.width + c.w);
      });
    }

    let isPlaying = false;
    let score = 0;
    let highScore =
      Number(localStorage.getItem("cloutyHopsHighScore")) ||
      Number(localStorage.getItem("highScore")) ||
      0;

    const bird = {
      x: 140,
      y: GAME_BASE_H / 2,
      width: 40,
      height: 40,
      velocity: 0,
      gravity: GRAVITY,
      rotation: 0,
      collisionRadius: 15,

      draw: function () {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
        this.rotation = Math.min(Math.max(this.velocity * 0.12, -0.65), 0.55);
        ctx.rotate(this.rotation);
        if (birdImgReady && birdImg.complete && birdImg.naturalWidth > 0) {
          ctx.drawImage(birdImg, -this.width / 2, -this.height / 2, this.width, this.height);
        } else {
          ctx.fillStyle = "#ffd700";
          ctx.strokeStyle = "#c90";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(0, 0, this.width / 2 - 2, this.height / 2 - 2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();
      },

      update: function () {
        this.velocity += this.gravity;
        this.y += this.velocity;
      },

      jump: function () {
        this.velocity = JUMP_FORCE;
      },

      reset: function () {
        this.x = Math.round(canvas.width * 0.18);
        this.y = canvas.height / 2;
        this.velocity = 0;
      }
    };

    let pipes = [];
    let spawnTimer = 0;

    function spawnIntervalFrames() {
      return Math.max(72, Math.min(130, Math.round(310 / PIPE_SPEED)));
    }

    function createPipe() {
      var minTop = Math.max(56, canvas.height * 0.12);
      var maxGap = Math.max(90, canvas.height - minTop - 90);
      var gap = Math.min(PIPE_GAP, maxGap);
      gap = Math.max(72, gap);
      var maxTop = canvas.height - gap - minTop;
      if (maxTop <= minTop) return;
      var topHeight = minTop + Math.random() * (maxTop - minTop);
      pipes.push({
        x: canvas.width + 4,
        topHeight: topHeight,
        gap: gap,
        scored: false
      });
    }

    function drawPipeSegment(px, py, pw, ph, flipCap) {
      var light = "#9acd32";
      var mid = "#5a9e3a";
      var dark = "#2d6b1f";
      var capH = Math.min(28, ph * 0.15);

      ctx.fillStyle = mid;
      ctx.fillRect(px, py, pw, ph);

      ctx.fillStyle = light;
      ctx.fillRect(px, py, 4, ph);
      ctx.fillStyle = dark;
      ctx.fillRect(px + pw - 5, py, 5, ph);

      ctx.strokeStyle = "#1a4d14";
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 1, py + 1, pw - 3, ph - 3);

      var capY = flipCap ? py + ph - capH : py;
      ctx.fillStyle = "#4a8528";
      ctx.fillRect(px - 3, capY, pw + 6, capH);
      ctx.fillStyle = light;
      ctx.fillRect(px - 3, capY, 4, capH);
      ctx.fillStyle = dark;
      ctx.fillRect(px + pw - 2, capY, 5, capH);
    }

    function drawPipes() {
      pipes.forEach(function (pipe) {
        var pg = pipe.gap != null ? pipe.gap : PIPE_GAP;
        drawPipeSegment(pipe.x, 0, PIPE_WIDTH, pipe.topHeight, false);
        drawPipeSegment(pipe.x, pipe.topHeight + pg, PIPE_WIDTH, canvas.height - (pipe.topHeight + pg), true);
      });
    }

    function drawBackground() {
      var sky = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.72);
      sky.addColorStop(0, "#87ceeb");
      sky.addColorStop(1, "#b8e0ff");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      bgScroll = (bgScroll + PIPE_SPEED * 0.35) % (canvas.width + 80);
      for (var i = 0; i < clouds.length; i++) {
        var c = clouds[i];
        c.x -= c.speed + PIPE_SPEED * 0.08;
        if (c.x + c.w < -20) {
          c.x = canvas.width + 40 + Math.random() * 80;
          c.y = 30 + Math.random() * (canvas.height * 0.38);
        }
        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.w * 0.45, c.h * 0.55, 0, 0, Math.PI * 2);
        ctx.ellipse(c.x + c.w * 0.35, c.y + 4, c.w * 0.38, c.h * 0.48, 0, 0, Math.PI * 2);
        ctx.ellipse(c.x - c.w * 0.28, c.y + 3, c.w * 0.35, c.h * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      var groundY = canvas.height - 72;
      ctx.fillStyle = "#deb887";
      ctx.fillRect(0, groundY, canvas.width, 72);
      ctx.strokeStyle = "#7cbd52";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      var stripeOff = (bgScroll % 40) - 40;
      ctx.fillStyle = "rgba(60, 120, 40, 0.35)";
      for (var sx = stripeOff; sx < canvas.width + 40; sx += 40) {
        ctx.fillRect(sx, groundY + 8, 20, 56);
      }
    }

    function drawHud() {
      var label = String(score);
      ctx.save();
      ctx.font = "bold " + Math.round(Math.min(canvas.width * 0.11, 56)) + 'px Tahoma, "Segoe UI", sans-serif';
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#000";
      ctx.strokeText(label, canvas.width / 2, 18);
      ctx.fillStyle = "#fff";
      ctx.fillText(label, canvas.width / 2, 18);

      if (highScore > 0 && isPlaying) {
        ctx.font = '11px Tahoma, sans-serif';
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#000";
        ctx.strokeText("Best " + highScore, canvas.width / 2, 68);
        ctx.fillStyle = "#ece9d8";
        ctx.fillText("Best " + highScore, canvas.width / 2, 68);
      }
      ctx.restore();
    }

    function syncScoreAria() {
      scoreDisplay.textContent = "Score: " + score;
    }

    function checkCollision(pipe) {
      var bx = bird.x + bird.width / 2;
      var by = bird.y + bird.height / 2;
      var r = bird.collisionRadius;
      var pg = pipe.gap != null ? pipe.gap : PIPE_GAP;

      if (bx + r > pipe.x && bx - r < pipe.x + PIPE_WIDTH) {
        if (by - r < pipe.topHeight || by + r > pipe.topHeight + pg) {
          return true;
        }
      }
      return false;
    }

    let lastTime = 0;

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      var deltaTime = Math.min(3, (timestamp - lastTime) / 16);
      lastTime = timestamp;

      layoutCanvasToContainer();

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();

      if (!isPlaying) {
        drawHud();
        ctx.fillStyle = "#000";
        ctx.font = '14px Tahoma, sans-serif';
        ctx.textAlign = "center";
        ctx.fillText("Press SPACE or tap Flap to play", canvas.width / 2, canvas.height / 2 - 18);
        if (highScore > 0) {
          ctx.fillStyle = "#333";
          ctx.font = '12px Tahoma, sans-serif';
          ctx.fillText("Best score: " + highScore, canvas.width / 2, canvas.height / 2 + 10);
        }
        bird.draw();
        requestAnimationFrame(gameLoop);
        return;
      }

      bird.update();
      bird.draw();

      spawnTimer++;
      if (spawnTimer >= spawnIntervalFrames()) {
        createPipe();
        spawnTimer = 0;
      }

      pipes.forEach(function (pipe) {
        pipe.x -= PIPE_SPEED * deltaTime;
        if (!pipe.scored && pipe.x + PIPE_WIDTH < bird.x) {
          score++;
          pipe.scored = true;
          syncScoreAria();
        }
      });

      drawPipes();
      drawHud();

      pipes = pipes.filter(function (pipe) {
        return pipe.x > -PIPE_WIDTH - 20;
      });

      var groundY = canvas.height - 72;
      if (
        bird.y + bird.height / 2 > groundY ||
        bird.y - bird.height / 2 < 0 ||
        pipes.some(checkCollision)
      ) {
        gameOver();
        return;
      }

      requestAnimationFrame(gameLoop);
    }

    function hideGameOver() {
      gameOverlay.classList.remove("is-visible");
      gameOverlay.setAttribute("aria-hidden", "true");
    }

    function showGameOver() {
      overlayScoreLine.textContent = "Score: " + score;
      overlayBestLine.textContent = "Best: " + highScore;
      gameOverlay.classList.add("is-visible");
      gameOverlay.setAttribute("aria-hidden", "false");
    }

    function startGame() {
      hideGameOver();
      isPlaying = true;
      score = 0;
      pipes = [];
      spawnTimer = spawnIntervalFrames() - 5;
      bird.reset();
      bird.gravity = GRAVITY;
      syncScoreAria();
    }

    function gameOver() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("cloutyHopsHighScore", String(highScore));
        localStorage.setItem("highScore", String(highScore));
      }
      isPlaying = false;
      pipes = [];
      showGameOver();
      requestAnimationFrame(gameLoop);
    }

    function toggleSettings() {
      document.getElementById("settingsPanel").classList.toggle("visible");
    }

    function updateSetting(setting, value) {
      var num = parseFloat(value);
      var valueDisplay = document.getElementById(setting + "Value");
      if (valueDisplay) valueDisplay.textContent = value;

      switch (setting) {
        case "gravity":
          GRAVITY = num;
          bird.gravity = num;
          if (valueDisplay) valueDisplay.textContent = num.toFixed(2);
          break;
        case "jumpForce":
          JUMP_FORCE = -Math.abs(num);
          if (valueDisplay) valueDisplay.textContent = Math.abs(JUMP_FORCE).toFixed(1);
          break;
        case "gameSpeed":
          PIPE_SPEED = num;
          if (valueDisplay) valueDisplay.textContent = num.toFixed(1);
          break;
        case "pipeGap":
          PIPE_GAP = num;
          break;
      }
    }

    document.querySelectorAll(".settings-panel input").forEach(function (input) {
      input.addEventListener("input", function (e) {
        updateSetting(e.target.id, e.target.value);
      });
    });

    document.addEventListener("DOMContentLoaded", function () {
      layoutCanvasToContainer();
      bird.reset();

      var gc = document.querySelector(".game-container");
      if (gc && typeof ResizeObserver !== "undefined") {
        var ro = new ResizeObserver(function () {
          layoutCanvasToContainer();
        });
        ro.observe(gc);
      }
      window.addEventListener(
        "resize",
        function () {
          layoutCanvasToContainer();
        },
        { passive: true }
      );

      document.getElementById("gravity").value = GRAVITY;
      document.getElementById("jumpForce").value = Math.abs(JUMP_FORCE);
      document.getElementById("gameSpeed").value = PIPE_SPEED;
      document.getElementById("pipeGap").value = PIPE_GAP;

      document.getElementById("gravityValue").textContent = GRAVITY;
      document.getElementById("jumpForceValue").textContent = Math.abs(JUMP_FORCE).toFixed(1);
      document.getElementById("gameSpeedValue").textContent = PIPE_SPEED.toFixed(1);
      document.getElementById("pipeGapValue").textContent = PIPE_GAP;

      if (btnSettings) btnSettings.addEventListener("click", toggleSettings);

      btnPlayAgain.addEventListener("click", function () {
        startGame();
      });

      syncScoreAria();
    });

    document.addEventListener("keydown", function (e) {
      if (e.code === "Space") {
        e.preventDefault();
        if (!isPlaying) startGame();
        else bird.jump();
      }
    });

    jumpButton.addEventListener("click", function () {
      if (!isPlaying) startGame();
      else bird.jump();
    });

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
