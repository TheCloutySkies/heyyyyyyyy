<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Clouty Hops</title>
  <meta name="theme-color" content="#245EDC" />
  <script>
    /* Inside a shell window the game drops its own window frame */
    if (/[?&]embed=1/.test(location.search)) {
      document.documentElement.setAttribute("data-embedded", "");
    }
  </script>
  <link rel="stylesheet" href="vendor/xp.css?v=2" />
  <link rel="stylesheet" href="luna.css?v=4" />
  <style>
    *,
    *::before,
    *::after { box-sizing: border-box; }

    html,
    body { height: 100%; }

    body.hops-body { margin: 0; }

    /* The board is Flappy Bird's 288 x 512 sheet; the window is shaped around it. */
    .hops-app {
      display: flex;
      flex-direction: column;
      width: min(94vw, 430px);
      height: min(calc(100dvh - 32px), 730px);
      max-height: calc(100dvh - 16px);
    }

    .hops-stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: var(--luna-face);
    }

    #board {
      display: block;
      max-width: 100%;
      max-height: 100%;
      background: #4ec0ca;
      outline: 1px solid var(--luna-border);
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.22);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      cursor: pointer;
      outline-offset: 0;
    }

    #board:focus-visible {
      outline: 1px dotted #fff;
      outline-offset: -3px;
    }

    .hops-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 6px 8px 8px;
      background: var(--luna-face);
    }

    .hops-btn {
      min-width: 0;
      min-height: 23px;
      padding: 0 10px;
      font: 11px var(--luna-font-ui);
    }

    .hops-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* Embedded in a shell window: fill it, no window furniture of our own. */
    html[data-embedded],
    html[data-embedded] body,
    html[data-embedded] body.hops-body { height: 100%; }

    html[data-embedded] .hops-app {
      width: 100%;
      height: 100%;
      max-height: none;
      min-height: 0;
    }

    html[data-embedded] .hops-stage { padding: 0; }

    html[data-embedded] #btn-fullscreen { display: none; }

    @media (max-width: 460px) {
      .hops-app {
        width: min(98vw, 430px);
        height: min(calc(100dvh - 16px), 730px);
      }

      .hops-btn { min-height: 28px; font-size: 12px; }
    }
  </style>
</head>
<body class="luna-page hops-body">

<main class="window luna-app hops-app" role="application" aria-label="Clouty Hops">
  <div class="title-bar">
    <div class="title-bar-text">
      <img src="icons/game_mine_1-0.png" alt="" width="16" height="16" style="vertical-align: text-bottom; margin-right: 6px; image-rendering: pixelated;" />
      Clouty Hops
    </div>
    <div class="title-bar-controls">
      <button type="button" aria-label="Close" title="Close and return to the desktop" onclick="location.href='index.html'"></button>
    </div>
  </div>

  <div class="game-container hops-stage" id="stage">
    <canvas id="board" width="288" height="512" tabindex="0"
            aria-label="Clouty Hops. Click, tap or press Space to flap your face through the pipes."></canvas>
    <p class="hops-sr" id="live" aria-live="polite"></p>
  </div>

  <div class="hops-actions">
    <button type="button" class="button hops-btn" id="btn-play">New Game</button>
    <button type="button" class="button hops-btn" id="btn-sound" aria-pressed="true">Sound: On</button>
    <button type="button" class="button hops-btn" id="btn-fullscreen">Full Screen</button>
  </div>

  <div class="status-bar">
    <p class="status-bar-field" id="status-msg">Click, tap or press Space to flap</p>
    <p class="status-bar-field" id="status-best">Best: 0</p>
  </div>
</main>

<script>

(function () {
  "use strict";

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");
  var live = document.getElementById("live");
  var playBtn = document.getElementById("btn-play");
  var soundBtn = document.getElementById("btn-sound");
  var fullBtn = document.getElementById("btn-fullscreen");
  var statusMsg = document.getElementById("status-msg");
  var statusBest = document.getElementById("status-best");

  /* ---------- the board: Flappy Bird's 288 x 512 sheet, pixel for pixel ---------- */

  var W = 288;
  var H = 512;
  var GROUND_H = 112;
  var SKY_H = H - GROUND_H;      /* 400 px of playfield */

  var GRAVITY = 0.25;            /* px per frame squared */
  var FLAP_V = -4.6;             /* one flap climbs ~42 px */
  var MAX_FALL = 10;
  var PIPE_SPEED = 2;            /* px per frame, 120 px/s */
  var PIPE_W = 52;
  var CAP_W = 58;
  var CAP_H = 24;
  var GAP = 132;                 /* tall enough for a 45 px face */
  var SPACING = 170;             /* left edges of consecutive pipes */
  var BIRD_W = 40;
  var BIRD_H = 50;
  var BIRD_X = 74;
  var HIT_RX = 12;               /* forgiving ellipse inside the face */
  var HIT_RY = 15;
  var PLAY = { x: 104, y: 324, w: 80, h: 30 };

  var C = {
    sky: "#4ec0ca",
    cloud: "#fdfffe",
    bush: "#8ed77f",
    bushShade: "#6fc162",
    grass: "#7ecb6b",
    grassSeam: "#5aa84d",
    ground: "#ded895",
    groundStripe: "#d2ca83",
    groundEdge: "#b9ae63",
    pipe: "#73bf2e",
    pipeLight: "#a8e35f",
    pipeDark: "#579d24",
    pipeLine: "#3f5c24",
    ink: "#543847",
    cream: "#ded895",
    creamEdge: "#c9c07f",
    white: "#ffffff",
    orange: "#f0a02a",
    green: "#7ecb6b",
    greenDark: "#4e9c3f"
  };

  /* ---------- state ---------- */

  var memory = {};

  var state = "ready";           /* ready | playing | dying | over */
  var score = 0;
  var best = readBest();
  var newBest = false;
  var bird = { x: BIRD_X, y: SKY_H * 0.45, vy: 0, rot: 0 };
  var pipes = [];
  var clouds = [];
  var scroll = 0;
  var shake = 0;
  var flash = 0;
  var overAt = 0;
  var tMs = 0;
  var last = 0;
  var acc = 0;
  var STEP = 1000 / 60;
  var running = true;

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var face = new Image();
  face.decoding = "async";
  face.src = "face.png";
  var faceReady = false;
  face.onload = function () { faceReady = face.naturalWidth > 0; };

  /* ---------- persistence: strict privacy modes block storage, so keep a copy ---------- */

  function readStore(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (e) {
      return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null;
    }
  }

  function writeStore(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (e) {
      memory[key] = value;
    }
  }

  function readBest() {
    var raw = readStore("cloutyHopsBest");
    if (raw === null) raw = readStore("highScore");   /* the old game's key */
    var n = parseInt(raw, 10);
    return isFinite(n) && n > 0 ? n : 0;
  }

  /* ---------- sound: four tiny synthesised effects, no audio files ---------- */

  var audioCtx = null;
  var muted = readStore("cloutyHopsMuted") === "true";

  function ensureAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) {
      try {
        audioCtx = new AC();
      } catch (e) {
        return null;
      }
    }
    if (audioCtx.state === "suspended" && audioCtx.resume) audioCtx.resume();
    return audioCtx;
  }

  function tone(from, to, dur, type, gain) {
    if (muted) return;
    var ac = ensureAudio();
    if (!ac) return;
    var now = ac.currentTime;
    var osc = ac.createOscillator();
    var amp = ac.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(from, now);
    if (to && to !== from) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), now + dur);
    amp.gain.setValueAtTime(0.0001, now);
    amp.gain.exponentialRampToValueAtTime(gain || 0.06, now + 0.008);
    amp.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(amp).connect(ac.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  function sfxWing() { tone(420, 620, 0.07, "triangle", 0.05); }
  function sfxPoint() { tone(880, 880, 0.06, "square", 0.045); setTimeout(function () { tone(1320, 1320, 0.08, "square", 0.04); }, 70); }
  function sfxHit() { tone(220, 90, 0.12, "square", 0.07); }
  function sfxDie() { setTimeout(function () { tone(400, 60, 0.4, "sawtooth", 0.05); }, 90); }
  function sfxSwoosh() { tone(300, 700, 0.13, "sine", 0.04); }

  /* ---------- sizing: the board keeps its shape at whatever size the window is ---------- */

  function fitBoard() {
    if (!stage) return;
    var pad = 12;
    var sw = stage.clientWidth - pad;
    var sh = stage.clientHeight - pad;
    if (sw <= 0 || sh <= 0) return;
    var scale = Math.min(sw / W, sh / H);
    /* fills the window at any size; the art stays nearest-neighbour crisp */
    scale = Math.max(0.5, Math.min(4, scale));
    var cw = Math.max(180, Math.round(W * scale));
    var ch = Math.max(320, Math.round(H * scale));
    if (canvas.style.width === cw + "px" && canvas.style.height === ch + "px") return;
    canvas.style.width = cw + "px";
    canvas.style.height = ch + "px";
  }


  /* ---------- drawing ---------- */

  function roundRect(x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  /* Chunky outlined lettering, the way Flappy Bird sets its text. */
  function chalk(text, x, y, size, fill, align) {
    ctx.font = "700 " + size + 'px "Trebuchet MS", Tahoma, Geneva, sans-serif';
    ctx.textAlign = align || "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.miterLimit = 2;
    ctx.lineWidth = Math.max(3, Math.round(size * 0.24));
    ctx.strokeStyle = C.ink;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function makeClouds() {
    clouds = [];
    for (var i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * W,
        y: 20 + Math.random() * 210,
        s: 0.55 + Math.random() * 0.75,
        v: 0.12 + Math.random() * 0.16
      });
    }
  }

  function drawSky() {
    ctx.fillStyle = C.sky;
    ctx.fillRect(-10, -10, W + 20, H + 20);
    var g = ctx.createLinearGradient(0, SKY_H * 0.45, 0, SKY_H);
    g.addColorStop(0, "rgba(255,255,255,0)");
    g.addColorStop(1, "rgba(255,255,255,0.34)");
    ctx.fillStyle = g;
    ctx.fillRect(-10, SKY_H * 0.45, W + 20, SKY_H * 0.55 + 10);
  }

  function drawClouds() {
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      var x = c.x;
      var y = c.y;
      var s = c.s;
      ctx.fillStyle = C.cloud;
      ctx.beginPath();
      ctx.arc(x, y, 11 * s, 0, Math.PI * 2);
      ctx.arc(x + 13 * s, y + 3 * s, 8 * s, 0, Math.PI * 2);
      ctx.arc(x - 13 * s, y + 3 * s, 7 * s, 0, Math.PI * 2);
      ctx.arc(x + 4 * s, y - 7 * s, 8 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(x - 18 * s, y + 2 * s, 36 * s, 9 * s);
    }
  }

  /* The pale bush line that sits on the horizon in the day theme. */
  function drawBushes() {
    var base = SKY_H;
    var step = 34;
    var off = -(scroll * 0.55) % step;
    ctx.fillStyle = C.bush;
    for (var x = off - step; x < W + step; x += step) {
      ctx.beginPath();
      ctx.arc(x + step / 2, base, 17, Math.PI, 0);
      ctx.fill();
    }
    ctx.fillStyle = C.bushShade;
    ctx.fillRect(0, base - 3, W, 3);
  }

  function drawGround() {
    var grassH = 12;
    ctx.fillStyle = C.grass;
    ctx.fillRect(0, SKY_H, W, grassH);

    ctx.fillStyle = C.grassSeam;
    var seamOff = -scroll % 22;
    for (var x = seamOff - 22; x < W + 22; x += 22) {
      ctx.fillRect(x, SKY_H + grassH - 4, 11, 4);
    }

    ctx.fillStyle = C.ground;
    ctx.fillRect(0, SKY_H + grassH, W, GROUND_H - grassH);

    ctx.fillStyle = C.groundEdge;
    ctx.fillRect(0, SKY_H + grassH, W, 1);

    ctx.fillStyle = C.groundStripe;
    var off = -scroll % 24;
    for (var x2 = off - 24; x2 < W + 24; x2 += 24) {
      ctx.beginPath();
      ctx.moveTo(x2, SKY_H + grassH + 1);
      ctx.lineTo(x2 + 10, SKY_H + grassH + 1);
      ctx.lineTo(x2 + 2, H);
      ctx.lineTo(x2 - 8, H);
      ctx.closePath();
      ctx.fill();
    }
  }

  function pipeBody(x, y, w, h) {
    if (h <= 0) return;
    ctx.fillStyle = C.pipeLine;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = C.pipe;
    ctx.fillRect(x + 2, y, w - 4, h);
    ctx.fillStyle = C.pipeLight;
    ctx.fillRect(x + 6, y, 5, h);
    ctx.fillStyle = C.pipeDark;
    ctx.fillRect(x + w - 11, y, 5, h);
  }

  function pipeCap(x, y, w, h) {
    ctx.fillStyle = C.pipeLine;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = C.pipe;
    ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    ctx.fillStyle = C.pipeLight;
    ctx.fillRect(x + 6, y + 2, 6, h - 4);
    ctx.fillStyle = C.pipeDark;
    ctx.fillRect(x + w - 12, y + 2, 6, h - 4);
  }

  function drawPipes() {
    for (var i = 0; i < pipes.length; i++) {
      var p = pipes[i];
      var capX = p.x - (CAP_W - PIPE_W) / 2;
      /* top pipe: shaft down to the cap, cap at the mouth */
      pipeBody(p.x, 0, PIPE_W, Math.max(0, p.top - CAP_H));
      pipeCap(capX, p.top - CAP_H, CAP_W, CAP_H);
      /* bottom pipe: cap at the mouth, shaft to the ground */
      var mouth = p.top + GAP;
      pipeCap(capX, mouth, CAP_W, CAP_H);
      pipeBody(p.x, mouth + CAP_H, PIPE_W, Math.max(0, SKY_H - mouth - CAP_H));
    }
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    ctx.shadowColor = "rgba(20, 30, 40, 0.45)";
    ctx.shadowBlur = 5;
    ctx.shadowOffsetY = 2;
    if (faceReady) {
      ctx.drawImage(face, -BIRD_W / 2, -BIRD_H / 2, BIRD_W, BIRD_H);
    } else {
      ctx.fillStyle = "#ffd34d";
      ctx.fillRect(-BIRD_W / 2, -BIRD_H / 2, BIRD_W, BIRD_H);
      ctx.shadowColor = "transparent";
      ctx.fillStyle = C.ink;
      ctx.fillRect(-6, -8, 3, 3);
      ctx.fillRect(4, -8, 3, 3);
    }
    ctx.restore();
  }

  function drawScore() {
    if (state === "ready" || state === "over") return;
    chalk(String(score), W / 2, 62, 34, C.white);
  }

  function drawReady() {
    chalk("Clouty Hops", W / 2, 92, 24, C.orange);
    chalk("Get Ready!", W / 2, 132, 17, C.white);

    var x = W / 2 - 62;
    var y = 300;
    roundRect(x, y, 124, 54, 8);
    ctx.fillStyle = "rgba(255,255,255,0.86)";
    ctx.fill();
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 2;
    ctx.stroke();

    /* a tap / cursor mark, like the hand on the original title screen */
    var cx = x + 28;
    var cy = y + 27;
    ctx.fillStyle = C.ink;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 10);
    ctx.lineTo(cx + 11, cy + 9);
    ctx.lineTo(cx + 2, cy + 6);
    ctx.lineTo(cx - 1, cy + 13);
    ctx.lineTo(cx - 5, cy + 11);
    ctx.lineTo(cx - 2, cy + 4);
    ctx.lineTo(cx - 11, cy + 3);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = C.ink;
    ctx.font = '700 11px Tahoma, "Trebuchet MS", sans-serif';
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText("Click, tap or", x + 46, cy - 8);
    ctx.fillText("press Space", x + 46, cy + 7);

    if (best > 0) chalk("Best: " + best, W / 2, 384, 13, C.white);
  }

  function medalFor(n) {
    if (n >= 40) return { ring: "#dfe6ea", face: "#f4f8fa", ink: "#5d6b74" };
    if (n >= 30) return { ring: "#e0b730", face: "#ffd94a", ink: "#8a6209" };
    if (n >= 20) return { ring: "#a7b0b8", face: "#dfe6ea", ink: "#5d6b74" };
    if (n >= 10) return { ring: "#a3692f", face: "#cf8b4a", ink: "#6b3d13" };
    return null;
  }

  function drawOver() {
    chalk("Game Over", W / 2, 166, 26, C.orange);

    var bx = 44;
    var by = 192;
    var bw = 200;
    var bh = 122;

    roundRect(bx, by, bw, bh, 8);
    ctx.fillStyle = C.cream;
    ctx.fill();
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 3;
    ctx.stroke();

    roundRect(bx + 3, by + 3, bw - 6, 20, 6);
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fill();

    /* medal */
    var m = medalFor(score);
    var mcx = bx + 40;
    var mcy = by + 62;
    ctx.beginPath();
    ctx.arc(mcx, mcy, 25, 0, Math.PI * 2);
    if (m) {
      ctx.fillStyle = m.face;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = m.ring;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(mcx, mcy, 14, 0, Math.PI * 2);
      ctx.strokeStyle = m.ink;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = "rgba(0,0,0,0.06)";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(84,56,71,0.35)";
      ctx.stroke();
    }

    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillStyle = C.ink;
    ctx.font = '700 9px Tahoma, "Trebuchet MS", sans-serif';
    ctx.fillText("SCORE", bx + 78, by + 46);
    ctx.fillText("BEST", bx + 78, by + 82);

    ctx.textAlign = "right";
    ctx.fillStyle = "#c05a1e";
    ctx.font = '700 16px Tahoma, "Trebuchet MS", sans-serif';
    ctx.fillText(String(score), bx + bw - 12, by + 48);
    ctx.fillText(String(best), bx + bw - 12, by + 84);

    if (newBest) {
      roundRect(bx + 74, by + 96, 34, 14, 7);
      ctx.fillStyle = "#e8542f";
      ctx.fill();
      ctx.fillStyle = C.white;
      ctx.font = "700 9px Tahoma, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("NEW", bx + 91, by + 103);
    }

    /* play button */
    var px = PLAY.x;
    var py = PLAY.y;
    roundRect(px, py, PLAY.w, PLAY.h, 7);
    ctx.fillStyle = C.greenDark;
    ctx.fill();
    roundRect(px + 1, py + 1, PLAY.w - 2, PLAY.h - 2, 6);
    var pg = ctx.createLinearGradient(0, py, 0, py + PLAY.h);
    pg.addColorStop(0, "#9fe08d");
    pg.addColorStop(1, C.greenDark);
    ctx.fillStyle = pg;
    ctx.fill();
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 2;
    roundRect(px, py, PLAY.w, PLAY.h, 7);
    ctx.stroke();
    chalk("PLAY", px + PLAY.w / 2, py + PLAY.h / 2 + 1, 14, C.white);
  }

  function render() {
    ctx.save();
    if (shake > 0.4) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawSky();
    drawClouds();
    drawBushes();
    drawPipes();
    drawGround();
    drawBird();
    drawScore();

    if (state === "ready") drawReady();
    if (state === "over") drawOver();

    ctx.restore();

    if (flash > 0.01) {
      ctx.fillStyle = "rgba(255,255,255," + flash.toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }


  /* ---------- simulation ---------- */

  function makePipe(x) {
    var minTop = 52;
    var maxTop = SKY_H - GAP - 64;
    var top = minTop + Math.random() * (maxTop - minTop);
    return { x: x, top: top, scored: false };
  }

  function spawnPipe(x) {
    pipes.push(makePipe(x));
  }

  function driftClouds(k) {
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      c.x -= c.v * k;
      if (c.x < -40) {
        c.x = W + 40;
        c.y = 16 + Math.random() * 210;
      }
    }
  }

  function birdHits(p) {
    if (bird.x + HIT_RX < p.x || bird.x - HIT_RX > p.x + PIPE_W) return false;
    var top = bird.y - HIT_RY;
    var bottom = bird.y + HIT_RY;
    return top < p.top || bottom > p.top + GAP;
  }

  function update() {
    tMs += STEP;

    if (state === "ready") {
      bird.y = SKY_H * 0.45 + Math.sin(tMs / 300) * 7;
      bird.rot = Math.sin(tMs / 300) * 0.12;
      scroll += PIPE_SPEED;
      driftClouds(0.4);
      return;
    }

    if (state === "over") {
      driftClouds(0.2);
      if (shake > 0.05) shake *= 0.88;
      else shake = 0;
      if (flash > 0.01) flash *= 0.88;
      else flash = 0;
      return;
    }

    if (state === "dying") {
      bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
      bird.y += bird.vy;
      bird.rot = Math.min(1.5, bird.rot + 0.07);
      if (shake > 0.05) shake *= 0.86;
      else shake = 0;
      if (flash > 0.01) flash *= 0.88;
      else flash = 0;
      if (bird.y >= SKY_H - HIT_RY) {
        bird.y = SKY_H - HIT_RY;
        land();
      }
      return;
    }

    /* playing */
    bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
    bird.y += bird.vy;
    if (bird.y < 26) {
      bird.y = 26;
      if (bird.vy < 0) bird.vy = -0.4;
    }

    var target = bird.vy < 0 ? -0.5 : Math.min(1.45, (bird.vy / MAX_FALL) * 1.45);
    bird.rot += (target - bird.rot) * 0.2;

    scroll += PIPE_SPEED;
    driftClouds(0.55);
    if (shake > 0.05) shake *= 0.85;
    else shake = 0;
    if (flash > 0.01) flash *= 0.82;
    else flash = 0;

    for (var i = 0; i < pipes.length; i++) {
      var p = pipes[i];
      p.x -= PIPE_SPEED;
      if (!p.scored && p.x + PIPE_W < bird.x - HIT_RX) {
        p.scored = true;
        score++;
        sfxPoint();
        setStatus("Score: " + score);
        syncReadouts();
      }
    }

    pipes = pipes.filter(function (q) { return q.x > -CAP_W - 12; });

    var lastPipe = pipes.length ? pipes[pipes.length - 1] : null;
    if (!lastPipe || lastPipe.x <= W - SPACING) spawnPipe(W + 8);

    if (bird.y + HIT_RY >= SKY_H) {
      bird.y = SKY_H - HIT_RY;
      die(true);
      return;
    }

    for (var j = 0; j < pipes.length; j++) {
      if (birdHits(pipes[j])) {
        die(false);
        return;
      }
    }
  }

  /* ---------- flow ---------- */

  function setStatus(text) {
    if (statusMsg) statusMsg.textContent = text;
  }

  function syncReadouts() {
    if (statusBest) statusBest.textContent = "Best: " + best;
  }

  function reset() {
    state = "ready";
    score = 0;
    newBest = false;
    bird.x = BIRD_X;
    bird.y = SKY_H * 0.45;
    bird.vy = 0;
    bird.rot = 0;
    pipes = [];
    shake = 0;
    flash = 0;
    overAt = 0;
    setStatus("Click, tap or press Space to flap");
    syncReadouts();
  }

  function startGame() {
    state = "playing";
    score = 0;
    newBest = false;
    pipes = [];
    bird.x = BIRD_X;
    bird.y = SKY_H * 0.45;
    bird.vy = FLAP_V;
    bird.rot = -0.5;
    spawnPipe(W + 62);
    sfxSwoosh();
    setStatus("Score: 0");
    syncReadouts();
  }

  function flap() {
    bird.vy = FLAP_V;
    bird.rot = -0.5;
    sfxWing();
  }

  function die(onGround) {
    state = "dying";
    if (!reduced) {
      shake = 7;
      flash = 0.75;
    }
    sfxHit();
    sfxDie();
    if (onGround) land();
  }

  function land() {
    state = "over";
    overAt = tMs;
    if (score > best) {
      best = score;
      newBest = true;
      writeStore("cloutyHopsBest", String(best));
    }
    syncReadouts();
    setStatus("Game over — score " + score + ". Click or press Space to play again.");
    if (live) live.textContent = "Game over. Score " + score + ", best " + best + ".";
  }

  function press() {
    ensureAudio();
    if (state === "ready") {
      startGame();
      return;
    }
    if (state === "playing") {
      flap();
      return;
    }
    if (state === "over" && tMs - overAt > 320) {
      startGame();
    }
  }

  /* ---------- input ---------- */

  var lastPointerAt = 0;

  canvas.addEventListener(
    "pointerdown",
    function (e) {
      e.preventDefault();
      lastPointerAt = Date.now();
      canvas.focus({ preventScroll: true });
      press();
    },
    { passive: false }
  );

  /* Clicks that arrive without a pointer event (assistive tech, scripted
     activation, an old browser) still flap, without double-triggering. */
  canvas.addEventListener("click", function (e) {
    if (Date.now() - lastPointerAt < 700) return;
    e.preventDefault();
    canvas.focus({ preventScroll: true });
    press();
  });

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === " " || k === "Spacebar" || e.code === "Space" || e.code === "ArrowUp" || k === "ArrowUp" || k === "Enter") {
      if (e.target && /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(e.target.tagName)) return;
      e.preventDefault();
      press();
    }
  });

  if (playBtn) {
    playBtn.addEventListener("click", function () {
      ensureAudio();
      if (state === "ready" || state === "over") startGame();
      else reset();
    });
  }

  function paintSoundButton() {
    if (!soundBtn) return;
    soundBtn.textContent = "Sound: " + (muted ? "Off" : "On");
    soundBtn.setAttribute("aria-pressed", muted ? "false" : "true");
  }

  if (soundBtn) {
    soundBtn.addEventListener("click", function () {
      muted = !muted;
      writeStore("cloutyHopsMuted", muted ? "true" : "false");
      paintSoundButton();
      if (!muted) sfxWing();
    });
  }

  if (fullBtn) {
    fullBtn.addEventListener("click", function () {
      var root = document.documentElement;
      var target = stage || canvas;
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else if (target.requestFullscreen) {
          target.requestFullscreen().catch(function () {});
        } else if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
        }
      } catch (e) {
        /* fullscreen can be blocked inside an embedded frame; the shell window
           can still be dragged or maximised */
      }
      if (root) fitBoard();
    });
  }

  document.addEventListener("fullscreenchange", fitBoard);
  document.addEventListener("webkitfullscreenchange", fitBoard);

  document.addEventListener("visibilitychange", function () {
    running = !document.hidden;
    if (running) {
      last = 0;
      acc = 0;
    }
  });

  /* ---------- loop ---------- */

  function frame(now) {
    window.requestAnimationFrame(frame);
    if (!running) return;
    if (!last) {
      last = now;
      return;
    }
    var dt = now - last;
    last = now;
    if (dt > 250) dt = STEP;
    acc += dt;
    var guard = 0;
    while (acc >= STEP && guard < 5) {
      update();
      acc -= STEP;
      guard++;
    }
    if (acc > STEP * 5) acc = 0;
    render();
  }

  /* ---------- boot ---------- */

  fitBoard();
  makeClouds();
  reset();
  paintSoundButton();
  syncReadouts();

  if (typeof ResizeObserver !== "undefined" && stage) {
    new ResizeObserver(fitBoard).observe(stage);
  }
  window.addEventListener("resize", fitBoard, { passive: true });
  window.addEventListener("orientationchange", fitBoard, { passive: true });

  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
